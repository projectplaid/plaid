-- vim:set ft=lua:
-- apps/l4-echo: an Oberon echo server and client. The server's gate is a
-- factory; ned opens one session on it for the client, and the client
-- opens and drops another one itself.

local L4 = require("L4");
local l = L4.default_loader;

local echo = l:new_channel();

l:start({ caps = { echo = echo:svr() }, log = { "server", "g" } },
        "rom/oberon-echo-server");

local session = L4.cast(L4.Proto.Factory, echo):create(0);
l:start({ caps = { echo = echo, session = session },
          log = { "client", "c" } },
        "rom/oberon-echo-client");
