-- vim:set ft=lua:
-- apps/l4-echo: an Oberon echo server and client, connected by an IPC gate.

local L4 = require("L4");
local l = L4.default_loader;

local echo = l:new_channel();

l:start({ caps = { echo = echo:svr() }, log = { "server", "g" } },
        "rom/oberon-echo-server");
l:start({ caps = { echo = echo }, log = { "client", "c" } },
        "rom/oberon-echo-client");
